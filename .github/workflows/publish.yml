name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build (e.g. v0.1.0)"
        required: true

jobs:
  release_zip_file:
    name: Run automations to build latest release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🛍️ Checkout the repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.event.release.tag_name }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 📝 Update manifest version
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.event.release.tag_name }}"
          VERSION="${TAG#v}"  # Remove 'v' prefix if it exists
          sed -i 's/"version": "[^"]*"/"version": "'"$VERSION"'"/' "${{ github.workspace }}/custom_components/ekeylegacy/manifest.json"

      - name: 🤐 Create HACS release ZIP
        run: |
          cd "${{ github.workspace }}"
          zip -qr "${{ github.workspace }}/ekeylegacy.zip" custom_components/ekeylegacy \
            -x '*/__pycache__/*' '*.pyc'

      - name: 🔍 Verify ZIP layout
        run: |
          zipinfo -1 "${{ github.workspace }}/ekeylegacy.zip"

      - name: ☁️ Upload zip to release
        uses: softprops/action-gh-release@v2.2.2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.event.release.tag_name }}
          files: "${{ github.workspace }}/ekeylegacy.zip"
